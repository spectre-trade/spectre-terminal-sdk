[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-terminal"
version = "0.1.0rc2"
description = "Python client for the Local API of Spectre Terminal: connections, instruments, trades, order books, clusters, candles, the account and order placement over HTTP and WebSocket on 127.0.0.1."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["websockets>=12"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
keywords = ["spectre", "trading", "terminal", "market-data", "orderbook", "websocket"]

[project.urls]
Homepage = "https://github.com/spectre-trade/spectre-terminal-sdk"
Repository = "https://github.com/spectre-trade/spectre-terminal-sdk"
Changelog = "https://github.com/spectre-trade/spectre-terminal-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/spectre-trade/spectre-terminal-sdk/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectre_terminal = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
