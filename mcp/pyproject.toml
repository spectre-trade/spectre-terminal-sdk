[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-terminal-mcp"
version = "0.1.0rc2"
description = "MCP server that gives AI agents a running Spectre Terminal over its Local API: market data, the account, trading, the layout and settings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "spectre-terminal==0.1.0rc2",
    "mcp>=2,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["spectre", "trading", "terminal", "mcp", "model-context-protocol", "market-data"]

[project.urls]
Homepage = "https://github.com/spectre-trade/spectre-terminal-sdk"
Repository = "https://github.com/spectre-trade/spectre-terminal-sdk"
Changelog = "https://github.com/spectre-trade/spectre-terminal-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/spectre-trade/spectre-terminal-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
spectre-terminal-mcp = "spectre_terminal_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
