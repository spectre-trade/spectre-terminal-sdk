[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre-terminal-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents read market data from a running Spectre Terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "spectre-terminal>=0.1.0,<0.2",
    "mcp>=2,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["spectre", "trading", "terminal", "mcp", "model-context-protocol", "market-data"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
spectre-terminal-mcp = "spectre_terminal_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
